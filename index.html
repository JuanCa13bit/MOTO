<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1015">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MotoControl — Gasolina & Mantenimiento</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0d1015;--card:#161b23;--card2:#1e242f;--bd:#2a3240;--tx:#e9eef6;--mu:#94a3b8;--pr:#3b82f6;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--safe:env(safe-area-inset-bottom,0px);--r:16px}
body.light{--bg:#f1f5f9;--card:#ffffff;--card2:#eef2f7;--bd:#d9e2ec;--tx:#0f172a;--mu:#5b6b80}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(100px + var(--safe));overscroll-behavior-y:contain;transition:background .2s,color .2s}
h1,h2,h3,h4{margin:0 0 8px;line-height:1.2} h2{font-size:17px} h3{font-size:19px} p{margin:0 0 8px}
.mu{color:var(--mu);font-size:14px} .sm{font-size:13px} .center{text-align:center}
.topbar{position:sticky;top:0;z-index:60;display:flex;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.bikesel{flex:1;min-height:46px;border-radius:12px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);font:600 15px/1 inherit;padding:0 12px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
.iconbtn{width:46px;height:46px;flex:0 0 46px;border-radius:12px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:60;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + var(--safe))}
.tabbar button{background:none;border:0;color:var(--mu);font:600 11px/1 inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:58px;border-radius:12px;cursor:pointer;transition:color .15s}
.tabbar button .ico{font-size:21px;line-height:1} .tabbar button.on{color:var(--pr);background:color-mix(in srgb,var(--pr) 12%,transparent)}
main{padding:14px 12px 24px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.tight{padding:12px} .card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px} .card-h h2{margin:0}
label.fld{display:block;margin-bottom:12px;font-size:13px;font-weight:700;color:var(--mu);letter-spacing:.3px;text-transform:uppercase}
input,select,textarea{width:100%;min-height:54px;border-radius:13px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);padding:12px 14px;font:16px/1.3 inherit;margin-top:6px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pr);box-shadow:0 0 0 3px color-mix(in srgb,var(--pr) 25%,transparent)}
input[type=checkbox]{width:26px;height:26px;min-height:0;margin:0;accent-color:var(--pr)} textarea{min-height:110px;resize:vertical}
.btn{width:100%;min-height:54px;border-radius:13px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);font:700 16px/1 inherit;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;padding:0 18px;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.975)} .btn.primary{background:var(--pr);border-color:var(--pr);color:#fff} .btn.ok{background:var(--ok);border-color:var(--ok);color:#06240f} .btn.danger{background:var(--bad);border-color:var(--bad);color:#fff} .btn.ghost{background:transparent} .btn.sm{min-height:46px;font-size:15px;padding:0 14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px} .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px} .inline{display:flex;gap:10px;align-items:center} .inline input{flex:1;margin-top:0} .inline .btn{width:auto;flex:0 0 auto;min-width:120px}
.check{display:flex;align-items:center;gap:12px;min-height:54px;padding:0 14px;border:1px solid var(--bd);border-radius:13px;background:var(--card2);margin-bottom:12px;font-weight:600;cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px} .tile{border-radius:14px;padding:12px 8px;text-align:center;border:1px solid var(--bd);background:var(--card2)}
.tile .t-lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mu);font-weight:800} .tile .t-val{font-size:15px;font-weight:800;margin-top:4px} .tile .dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-bottom:6px}
.st-green{--c:var(--ok)} .st-yellow{--c:var(--warn)} .st-red{--c:var(--bad)} .tile .dot{background:var(--c)}
.tile.st-green{border-color:color-mix(in srgb,var(--ok) 45%,var(--bd))} .tile.st-yellow{border-color:color-mix(in srgb,var(--warn) 55%,var(--bd));background:color-mix(in srgb,var(--warn) 10%,var(--card2))} .tile.st-red{border-color:color-mix(in srgb,var(--bad) 60%,var(--bd));background:color-mix(in srgb,var(--bad) 13%,var(--card2))}
.item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--card2);border:1px solid var(--bd);margin-bottom:8px;border-left:5px solid var(--c,var(--bd))}
.item-ico{font-size:22px;flex:0 0 28px;text-align:center} .item-main{flex:1;min-width:0} .item-title{font-weight:700;font-size:15px} .item-sub{font-size:12.5px;color:var(--mu);margin-top:2px}
.item .st-green{--c:var(--ok)} .item .st-yellow{--c:var(--warn)} .item .st-red{--c:var(--bad)}
.btn-mini{flex:0 0 auto;width:46px;height:46px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:22px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn-mini.primary{background:var(--pr);border-color:var(--pr);color:#fff}
.banner{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:14px;margin-bottom:10px;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card));font-size:14px;line-height:1.4}
.banner .b-ico{font-size:20px;line-height:1.2} .banner b{display:block;margin-bottom:2px}
.banner.st-green{--c:var(--ok)} .banner.st-yellow{--c:var(--warn)} .banner.st-red{--c:var(--bad)} .banner.st-info{--c:var(--pr)}
.big{font-size:38px;font-weight:800;letter-spacing:-1.5px;line-height:1} .big small{font-size:15px;font-weight:700;color:var(--mu);letter-spacing:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px} .stat{background:var(--card2);border:1px solid var(--bd);border-radius:13px;padding:11px 12px}
.stat .s-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);font-weight:800} .stat .s-val{font-size:19px;font-weight:800;margin-top:3px} .stat .s-val small{font-size:12px;color:var(--mu);font-weight:600}
.rec{display:flex;gap:12px;align-items:center;padding:12px;border-radius:13px;background:var(--card2);border:1px solid var(--bd);margin-bottom:8px}
.rec-ico{font-size:19px;flex:0 0 24px;text-align:center} .rec-main{flex:1;min-width:0} .rec-t{font-weight:700;font-size:14.5px} .rec-s{font-size:12.5px;color:var(--mu);margin-top:2px}
.rec-v{font-weight:800;font-size:15px;text-align:right;white-space:nowrap} .rec-del{flex:0 0 auto;width:40px;height:40px;border-radius:11px;border:1px solid var(--bd);background:transparent;color:var(--bad);font-size:17px;cursor:pointer}
.empty{text-align:center;padding:26px 10px;color:var(--mu);font-size:14px}
#modal{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6);backdrop-filter:blur(3px)}
#modal.open{display:flex} .modal-card{width:100%;max-width:560px;background:var(--card);border:1px solid var(--bd);border-radius:22px 22px 0 0;padding:20px 16px calc(20px + var(--safe));max-height:92vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.chart{display:block;width:100%;height:auto;margin-top:6px}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px} table.tbl th,table.tbl td{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top} table.tbl th{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mu)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cfgrow{padding:11px 0;border-bottom:1px solid var(--bd)} .cfgrow:last-child{border-bottom:0} .cfgname{font-weight:700;font-size:14px;margin-bottom:7px}
.cfginputs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px} .cfginputs label{font-size:10.5px;color:var(--mu);font-weight:700;text-transform:uppercase;letter-spacing:.3px} .cfginputs input{min-height:46px;padding:8px 10px;margin-top:4px;font-size:15px}
.menu-btn{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:0 16px;border-radius:14px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);font:600 15.5px/1.2 inherit;cursor:pointer;margin-bottom:9px;text-align:left}
.menu-btn .m-ico{font-size:20px} .menu-btn .m-arrow{margin-left:auto;color:var(--mu);font-size:18px}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.3px;background:var(--card2);border:1px solid var(--bd);color:var(--mu)}
.pill.red{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)} .pill.yellow{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)} .pill.green{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
hr.sep{border:0;border-top:1px solid var(--bd);margin:14px 0}
@media print{.topbar,.tabbar,.no-print,#modal{display:none!important} body{background:#fff;color:#000;padding:0} .card{border:1px solid #ccc;break-inside:avoid} main{max-width:none;padding:0}}
</style>
</head>
<body>

<header class="topbar">
  <select id="bikeSel" class="bikesel" aria-label="Seleccionar motocicleta"></select>
  <span style="font-size:11px; color:var(--mu); font-weight:bold; margin-right:4px;">v10</span>
  <button class="iconbtn" data-act="toggleTheme" title="Cambiar tema">🌙</button>
</header>

<main id="app"></main>

<nav class="tabbar" id="tabbar">
  <button data-act="nav" data-view="dash"><span class="ico">🏠</span>Inicio</button>
  <button data-act="nav" data-view="fuel"><span class="ico">⛽</span>Gasolina</button>
  <button data-act="nav" data-view="maint"><span class="ico">🔧</span>Manto</button>
  <button data-act="nav" data-view="docs"><span class="ico">📄</span>Docs</button>
  <button data-act="nav" data-view="more"><span class="ico">⋯</span>Más</button>
</nav>

<div id="modal"></div>

<script>
"use strict";
/* ==========================================
   UTILS
   ========================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const pad2 = n => String(n).padStart(2, "0");
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const toNum = v => { const n = typeof v === "number" ? v : parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : NaN; };
const fmt = (n, d = 2) => (n === null || n === undefined || !isFinite(n)) ? "—" : Number(n).toLocaleString("es-ES", { minimumFractionDigits:d, maximumFractionDigits:d });
const fmt0 = n => fmt(n, 0);
const addMonths = (dateLike, m) => { const x = new Date(dateLike); const day = x.getDate(); x.setMonth(x.getMonth() + m); if (x.getDate() < day) x.setDate(0); return x; };
const addDays = (dateLike, n) => { const x = new Date(dateLike); x.setDate(x.getDate() + n); return x; };
const daysUntil = dateLike => { const a = new Date(); a.setHours(0,0,0,0); const b = new Date(dateLike); b.setHours(0,0,0,0); return Math.round((b - a) / 86400000); };
const humanDate = iso => { if (!iso) return "—"; const d = new Date(iso + "T00:00:00"); if (isNaN(d)) return iso; return d.toLocaleDateString("es-ES", { day:"2-digit", month:"short", year:"numeric" }); };
const LEVEL_RANK = { green:0, yellow:1, red:2 };
const worst = (a, b) => (LEVEL_RANK[a] >= LEVEL_RANK[b] ? a : b);
function parseNum(v) {
  if (v === null || v === undefined || v === "") return NaN;
  if (typeof v === "number") return isFinite(v) ? v : NaN;
  let s = String(v).trim().replace(/[^\d.,-]/g, "");
  if (!s) return NaN;
  const lc = s.lastIndexOf(","), ld = s.lastIndexOf(".");
  if (lc > -1 && ld > -1) { if (lc > ld) s = s.replace(/\./g, "").replace(",", "."); else s = s.replace(/,/g, ""); }
  else if (lc > -1) { const parts = s.split(","); if (parts.length === 2 && parts[1].length !== 3) s = s.replace(",", "."); else s = s.replace(/,/g, ""); }
  else if (ld > -1) { if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, ""); }
  const n = parseFloat(s); return isFinite(n) ? n : NaN;
}
function parseDate(v) {
  if (!v) return null; const s = String(v).trim(); if (!s) return null;
  let m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/); if (m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);
  if (m) { let d = +m[1], mo = +m[2], y = +m[3]; if (y < 100) y += 2000; if (mo > 12 && d <= 12) { const t = d; d = mo; mo = t; } if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31) return `${y}-${pad2(mo)}-${pad2(d)}`; }
  const dt = new Date(s); if (!isNaN(dt)) return `${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())}`; return null;
}
const normKey = s => String(s ?? "").toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
function downloadFile(content, filename, mime) { const blob = new Blob([content], { type: mime }); const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500); }
function slug(s) { return String(s || "moto").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }

/* ==========================================
   ESTADO Y LOCALSTORAGE
   ========================================== */
const STORAGE_KEY = "motocontrol.v1";
const DEFAULT_CONFIG = {
  oil: { label:"Aceite de motor", icon:"🛢️", km:3000, months:6 },
  brakeFluid: { label:"Líquido de frenos", icon:"🧴", km:null, months:24 },
  brakePads: { label:"Pastillas / Balatas", icon:"🛑", km:10000, months:null },
  general: { label:"Revisión general", icon:"🔧", km:5000, months:12 },
  chainLube: { label:"Lubricar cadena", icon:"⛓️", km:500, months:null },
  chainTension: { label:"Tensión de cadena", icon:"🔩", km:1500, months:null },
  tires: { label:"Neumáticos (cambio)", icon:"🛞", km:15000, months:null },
  tirePressure: { label:"Presión de neumáticos", icon:"💨", km:null, months:null, days:7 },
  airFilter: { label:"Filtro de aire", icon:"🌬️", km:12000, months:12 },
  sparkPlug: { label:"Bujía", icon:"⚡", km:8000, months:24 },
  battery: { label:"Batería", icon:"🔋", km:null, months:24 },
  fuelFilter: { label:"Filtro de gasolina", icon:"🛢️", km:24000, months:24 }
};
const DOC_TYPES = [ { key:"soat", label:"SOAT / Seguro obligatorio", icon:"📄" }, { key:"rtv", label:"Inspección técnica vehicular", icon:"🔍" }, { key:"license", label:"Licencia de conducir", icon:"🪪" } ];
let STATE = {};
const UI = { view: "dash", sub: null, importPreview: null, history: { kind: "all", from: "", to: "" } };

function newBike(name) {
  return { id: uid(), name: name || "Mi Moto", createdAt: new Date().toISOString(), odometer: 0, tankCapacity: 3, consumptionAlertPct: 15, currency: "$", fixedEfficiency: 0, config: JSON.parse(JSON.stringify(DEFAULT_CONFIG)), fuel: [], maintenance: [], docs: {} };
}
function defaultState() { const b = newBike("Mi Moto"); return { version: 1, activeBikeId: b.id, bikes: [b], theme: "dark" }; }
function migrate(raw) {
  if (!raw || !Array.isArray(raw.bikes) || !raw.bikes.length) return defaultState();
  raw.bikes.forEach(b => {
    b.id = b.id || uid(); b.name = b.name || "Mi Moto"; b.createdAt = b.createdAt || new Date().toISOString();
    b.odometer = Number(b.odometer) || 0; b.tankCapacity = Number(b.tankCapacity) || 3; b.consumptionAlertPct = isFinite(b.consumptionAlertPct) ? Number(b.consumptionAlertPct) : 15;
    b.currency = b.currency || "$"; b.fixedEfficiency = Number(b.fixedEfficiency) || 0;
    const cfg = {}; for (const k of Object.keys(DEFAULT_CONFIG)) cfg[k] = Object.assign({}, DEFAULT_CONFIG[k], (b.config && b.config[k]) || {});
    if (b.config) for (const k of Object.keys(b.config)) if (!cfg[k]) cfg[k] = b.config[k];
    b.config = cfg;
    b.fuel = Array.isArray(b.fuel) ? b.fuel.map(f => ({ id: f.id || uid(), date: parseDate(f.date) || todayISO(), km: Number(f.km) || 0, gallons: Number(f.gallons) || 0, cost: Number(f.cost) || 0, fullTank: !!f.fullTank, notes: f.notes || "" })) : [];
    b.maintenance = Array.isArray(b.maintenance) ? b.maintenance.map(m => ({ id: m.id || uid(), type: m.type || "general", date: parseDate(m.date) || todayISO(), km: Number(m.km) || 0, cost: Number(m.cost) || 0, notes: m.notes || "" })) : [];
    b.docs = (b.docs && typeof b.docs === "object") ? b.docs : {};
  });
  raw.activeBikeId = raw.bikes.some(b => b.id === raw.activeBikeId) ? raw.activeBikeId : raw.bikes[0].id;
  raw.theme = raw.theme === "light" ? "light" : "dark";
  return raw;
}
function loadState() { try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return migrate(JSON.parse(raw)); } catch (err) {} return defaultState(); }
function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); } catch (err) { alert("No se pudo guardar."); } }
function activeBike() { return STATE.bikes.find(b => b.id === STATE.activeBikeId) || STATE.bikes[0]; }
function syncOdometer(bike) { const maxFuel = bike.fuel.reduce((m, f) => Math.max(m, f.km || 0), 0); const maxMaint = bike.maintenance.reduce((m, r) => Math.max(m, r.km || 0), 0); bike.odometer = Math.max(bike.odometer || 0, maxFuel, maxMaint); }
function commit() { saveState(); render(); }

/* ==========================================
   CÁLCULOS
   ========================================== */
function computeStatus(bike, key) {
  const cfg = bike.config[key] || {};
  const records = bike.maintenance.filter(m => m.type === key).sort((a, b) => (a.km - b.km) || (a.date < b.date ? -1 : 1));
  const last = records.length ? records[records.length - 1] : null;
  const res = { key, cfg, last, checks: [] };
  if (cfg.km) { const base = last ? last.km : 0; const due = base + cfg.km; const rem = due - bike.odometer; const warn = Math.max(cfg.km * 0.10, 50); const level = rem < 0 ? "red" : rem <= warn ? "yellow" : "green"; res.kmCheck = { due, rem, level }; res.checks.push(res.kmCheck); }
  if (cfg.months) { const start = last ? last.date : (bike.createdAt || Date.now()); const due = addMonths(start, cfg.months); const days = daysUntil(due); const warn = Math.max(Math.round(cfg.months * 30 * 0.10), 7); const level = days < 0 ? "red" : days <= warn ? "yellow" : "green"; res.dateCheck = { due, days, level, unit: "meses" }; res.checks.push(res.dateCheck); }
  if (cfg.days) { const start = last ? last.date : (bike.createdAt || Date.now()); const due = addDays(start, cfg.days); const days = daysUntil(due); const warn = Math.max(Math.round(cfg.days * 0.15), 1); const level = days < 0 ? "red" : days <= warn ? "yellow" : "green"; res.dateCheck = { due, days, level, unit: "días" }; res.checks.push(res.dateCheck); }
  res.level = res.checks.length ? res.checks.map(c => c.level).reduce(worst, "green") : "green";
  return res;
}
function statusText(s) {
  const parts = [];
  if (s.kmCheck) { const r = s.kmCheck.rem; parts.push(r < 0 ? `Vencido por ${fmt0(Math.abs(r))} km` : `Faltan ${fmt0(r)} km`); }
  if (s.dateCheck) { const d = s.dateCheck.days; parts.push(d < 0 ? `Vencido hace ${Math.abs(d)} d` : `Vence en ${d} d`); }
  return parts.join(" · ") || "Sin intervalo configurado";
}
function fuelStats(bike) {
  const validFills = bike.fuel.filter(f => f.km > 0 && f.gallons > 0);
  const fills = [...validFills].sort((a, b) => (a.km - b.km) || (a.date < b.date ? -1 : 1));
  const fulls = fills.filter(f => f.fullTank);
  const segments = [];
  for (let i = 1; i < fulls.length; i++) {
    const a = fulls[i - 1], b = fulls[i];
    const between = fills.filter(f => f.km > a.km && f.km <= b.km);
    const gallons = between.reduce((sum, f) => sum + (f.gallons || 0), 0);
    const dist = b.km - a.km;
    if (gallons > 0 && dist > 0) segments.push({ km: dist, gallons, kmg: dist / gallons, date: b.date, kmAt: b.km });
  }
  const totalSegKm = segments.reduce((s, x) => s + x.km, 0);
  const totalSegGal = segments.reduce((s, x) => s + x.gallons, 0);
  let avg = totalSegGal > 0 ? totalSegKm / totalSegGal : null;
  if (bike.fixedEfficiency > 0) avg = bike.fixedEfficiency;
  const totalCost = bike.fuel.reduce((s, f) => s + (f.cost || 0), 0);
  const ym = todayISO().slice(0, 7);
  const monthSpend = bike.fuel.filter(f => (f.date || "").startsWith(ym)).reduce((s, f) => s + (f.cost || 0), 0);
  let remaining = null, autonomy = null; let calcDetails = null;
  const lastFull = fulls.length ? fulls[fulls.length - 1] : null;
  if (lastFull && avg && bike.tankCapacity > 0) {
    const distSince = Math.max(bike.odometer - lastFull.km, 0);
    const used = distSince / avg;
    const addedAfter = bike.fuel.filter(f => f.km > lastFull.km && f.gallons > 0).reduce((s, f) => s + (f.gallons || 0), 0);
    remaining = Math.max(0, Math.min(bike.tankCapacity, bike.tankCapacity - used + addedAfter));
    autonomy = remaining * avg;
    calcDetails = { lastFullKm: lastFull.km, lastFullDate: lastFull.date, odometer: bike.odometer, distSince, avg, used, addedAfter, capacity: bike.tankCapacity };
  }
  const lastSeg = segments.length ? segments[segments.length - 1] : null;
  const dropPct = (avg && lastSeg && bike.fixedEfficiency === 0) ? ((avg - lastSeg.kmg) / avg) * 100 : 0;
  return { fills, fulls, segments, avg, totalCost, monthSpend, remaining, autonomy, lastSeg, dropPct, calcDetails };
}
function consumptionLevel(bike, st) { if (!st.avg || !st.lastSeg || bike.fixedEfficiency > 0) return "green"; return st.dropPct > (bike.consumptionAlertPct || 15) ? "red" : "green"; }
function autonomyLevel(bike, st) { if (st.remaining === null || !bike.tankCapacity) return "green"; const ratio = st.remaining / bike.tankCapacity; if (ratio <= 0.10) return "red"; if (ratio <= 0.25) return "yellow"; return "green"; }
function getFuelLevelInfo(st, capacity) {
  if (st.remaining === null || !capacity) return { text: "—", icon: "⛽", pct: 0 };
  const pct = st.remaining / capacity; let text = "", icon = "";
  if (pct <= 0.05) { text = "¡Vacío!"; icon = "🚨"; } else if (pct <= 0.20) { text = "Reserva"; icon = "⚠️"; } else if (pct <= 0.35) { text = "1/4 Tanque"; icon = "🔴"; } else if (pct <= 0.60) { text = "Mitad"; icon = "🟡"; } else if (pct <= 0.85) { text = "3/4 Tanque"; icon = "🟢"; } else { text = "Lleno"; icon = "🟢"; }
  return { text, icon, pct };
}
function getMaintRemaining(bike) { return Object.keys(bike.config).map(k => computeStatus(bike, k)).sort((a, b) => LEVEL_RANK[b.level] - LEVEL_RANK[a.level]); }

/* ==========================================
   VISTAS
   ========================================== */
function renderChart(segments) {
  if (segments.length < 2) return `<p class="mu sm">Necesitas al menos <b>2 llenados de tanque completo</b> para dibujar la curva.</p>`;
  const W = 340, H = 150, PL = 36, PR = 10, PT = 14, PB = 24;
  const vals = segments.map(s => s.kmg); let mn = Math.min(...vals), mx = Math.max(...vals);
  if (mx - mn < 1) { mn -= 1; mx += 1; } const pad = (mx - mn) * 0.12; mn -= pad; mx += pad;
  const X = i => PL + (i / (segments.length - 1)) * (W - PL - PR); const Y = v => (H - PB) - ((v - mn) / (mx - mn)) * (H - PT - PB);
  const pts = segments.map((s, i) => `${X(i).toFixed(1)},${Y(s.kmg).toFixed(1)}`); const line = "M" + pts.join(" L"); const area = `M${X(0).toFixed(1)},${H - PB} L${pts.join(" L")} L${X(segments.length - 1).toFixed(1)},${H - PB} Z`;
  let grid = ""; for (let i = 0; i <= 2; i++) { const v = mn + (mx - mn) * (i / 2); const y = Y(v); grid += `<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W - PR}" y2="${y.toFixed(1)}" stroke="currentColor" stroke-opacity=".12"/><text x="${PL - 6}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="9" fill="currentColor" opacity=".55">${v.toFixed(1)}</text>`; }
  const dots = segments.map((s, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(s.kmg).toFixed(1)}" r="3" fill="var(--pr)"/>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${grid}<path d="${area}" fill="var(--pr)" opacity=".14"/><path d="${line}" fill="none" stroke="var(--pr)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>`;
}

function viewDash(b) {
  const st = fuelStats(b); const fuelInfo = getFuelLevelInfo(st, b.tankCapacity); const autoLevel = autonomyLevel(b, st);
  const pendingMaint = getMaintRemaining(b).filter(s => s.level !== "green").slice(0, 3);
  const maintCards = pendingMaint.map(s => {
    let detalle = "";
    if (s.kmCheck && s.kmCheck.rem > 0) detalle = `En ${fmt0(s.kmCheck.rem)} km`; else if (s.kmCheck && s.kmCheck.rem <= 0) detalle = `¡Vencido por ${fmt0(Math.abs(s.kmCheck.rem))} km!`; else if (s.dateCheck) detalle = s.dateCheck.days >= 0 ? `En ${s.dateCheck.days} días` : `Vencido hace ${Math.abs(s.dateCheck.days)} d`;
    return `<div class="item st-${s.level}" style="margin-bottom:6px"><div class="item-ico">${s.cfg.icon || "🔧"}</div><div class="item-main"><div class="item-title">${esc(s.cfg.label)}</div><div class="item-sub" style="font-weight:600;color:var(--${s.level === 'red' ? 'bad' : s.level === 'yellow' ? 'warn' : 'ok'})">${detalle}</div></div></div>`;
  }).join("") || `<div class="empty">🟢 Sin vencimientos próximos</div>`;

  return `
  <section class="card">
    <div class="card-h"><h2>Kilometraje actual</h2><span class="pill">${esc(b.name)}</span></div>
    <div class="inline"><input id="odoInput" type="number" inputmode="numeric" step="1" min="0" value="${Math.round(b.odometer)}"><button class="btn primary" data-act="saveOdo">Guardar</button></div>
  </section>
  <section class="card st-${autoLevel}" style="border-width:2px; border-color:var(--c,var(--bd))">
    <div class="card-h" style="margin-bottom:2px"><h2 style="color:var(--c,var(--tx))">${fuelInfo.icon} Combustible</h2><span class="pill" style="background:var(--c,var(--bd));color:#fff;border:0">${fuelInfo.text}</span></div>
    <div class="big">${st.autonomy !== null ? `~${fmt0(st.autonomy)}` : '—'} <small>km restantes</small></div>
    <div style="display:flex; justify-content:space-between; margin-top:8px; font-size:12px; color:var(--mu); font-weight:600"><span>${fmt(st.remaining, 2)} gal estimados</span><span>Capacidad: ${fmt(b.tankCapacity, 1)} gal</span></div>
    <div style="width:100%; height:12px; background:var(--card2); border-radius:10px; margin-top:10px; overflow:hidden; border:1px solid var(--bd)"><div style="width:${Math.min(100, Math.max(0, fuelInfo.pct * 100))}%; height:100%; background:var(--c, var(--pr)); transition:width 0.3s ease"></div></div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px">
      ${b.fixedEfficiency > 0 ? `<p class="sm" style="margin:0;color:var(--ok)">Rendimiento fijo: ${b.fixedEfficiency} km/gal</p>` : `<p class="sm" style="margin:0;color:var(--warn); cursor:pointer" data-act="sub" data-sub="config">⚠️ Configura tu rendimiento</p>`}
      <button class="btn ghost sm" data-act="showCalc" style="min-height:34px; padding:0 12px; width:auto; margin:0; border:1px solid var(--bd)">🧮 Ver cálculo</button>
    </div>
  </section>
  <section class="card">
    <div class="card-h"><h2>Próximos Vencimientos</h2><button class="btn-mini" data-act="nav" data-view="maint" title="Ver todo">→</button></div>
    ${maintCards}
  </section>
  <section class="row2" style="margin-bottom:12px">
    <button class="btn primary" data-act="nav" data-view="fuel">⛽ Cargar gasolina</button>
    <button class="btn" data-act="openMaintPicker">🔧 Mantenimiento</button>
  </section>`;
}

function viewFuel(b) {

  const rows = list.length ? list.map(f => `

      <div class="rec-v">${esc(b.currency)}${fmt(f.cost, 2)}</div>
      <button class="rec-del" data-act="delFuel" data-id="${f.id}" aria-label="Eliminar">✕</button>
    </div>`).join("") : `<div class="empty">Sin cargas registradas todavía.</div>`;

  return `

    <div class="stats" style="margin-top:12px">
      <div class="stat"><div class="s-lbl">Promedio histórico</div><div class="s-val">${st.avg ? fmt(st.avg, 2) : "—"} <small>km/gal</small></div></div>
      <div class="stat"><div class="s-lbl">Último tanque</div><div class="s-val">${st.lastSeg ? fmt(st.lastSeg.kmg, 2) : "—"} <small>km/gal</small></div></div>
      <div class="stat"><div class="s-lbl">Gasto del mes</div><div class="s-val">${esc(b.currency)}${fmt(st.monthSpend, 2)}</div></div>
    </div>

  <section class="card">

    ${rows}
  </section>`;
}

  const blocks = statuses.map(s => {

    return `

  }).join("");
  return `<section class="card tight"><div class="card-h" style="padding:4px 4px 0"><h2>Estado de mantenimientos</h2></div></section><section class="card tight">${blocks}</section>`;
}

function viewDocs(b) {
  const items = DOC_TYPES.map(dt => {
    const d = b.docs[dt.key] || {}; let level = "green", text = "Sin fecha registrada";
    if (d.date) { const days = Math.round((new Date(d.date) - new Date().setHours(0,0,0,0)) / 86400000); level = days < 0 ? "red" : days <= 30 ? "yellow" : "green"; text = days < 0 ? `Vencido hace ${Math.abs(days)} días (${humanDate(d.date)})` : `Vence en ${days} días (${humanDate(d.date)})`; } else { level = "yellow"; }

function viewHistory(b) {

function viewBackup(b) {

/* ==========================================
   IMPORTACIÓN
   ========================================== */
const HEADER_ALIASES = { type: ["tipo", "categoria", "registro", "clase"], date: ["fecha", "date", "dia", "fec"], km: ["km", "kilometraje", "odometro", "kilometros", "km actual", "distancia", "odo"], gallons: ["galones", "galon", "gal", "gallons", "litros", "cantidad", "volumen", "gas"], cost: ["costo", "coste", "total", "valor", "precio", "importe", "monto", "cost", "pago"], fullTank: ["lleno", "tanque lleno", "full", "completo", "tanque"], notes: ["notas", "observaciones", "descripcion", "comentario", "detalle"], maintType: ["servicio", "mantenimiento", "componente", "pieza", "item", "tipo manto"] };
function splitLine(line, delim) { const out = []; let cur = "", q = false; for (let i = 0; i < line.length; i++) { const c = line[i]; if (q) { if (c === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; } else { if (c === '"') q = true; else if (c === delim) { out.push(cur); cur = ""; } else cur += c; } } out.push(cur); return out.map(s => s.trim()); }
function parseTable(text) { const lines = text.replace(/\r/g, "").split("\n").filter(l => l.trim() !== ""); if (!lines.length) return { rows: [] }; const first = lines[0]; const delim = first.includes("\t") ? "\t" : first.includes(";") ? ";" : ","; return { rows: lines.map(l => splitLine(l, delim)), delim }; }
function detectMapping(headers) { const map = {}; headers.forEach((h, i) => { const n = normKey(h); if (!n) return; for (const [field, aliases] of Object.entries(HEADER_ALIASES)) { if (aliases.some(a => n === a || n.includes(a))) { if (!Object.values(map).includes(field)) map[i] = field; break; } } }); return map; }
function boolFromCell(v) { const n = normKey(v); if (!n) return false; return ["si", "s", "yes", "y", "1", "true", "lleno", "full", "x", "completo"].includes(n); }
function runAnalyzeImport() {
  try {
    const ta = $("#importText"); const text = (ta ? ta.value : "").trim();
    if (!text) return alert("Pega los datos o sube un archivo primero.");
    if (text.startsWith("{")) { const taRestore = $("#restoreText"); if (taRestore) taRestore.value = text; runRestoreJSON(); return; }
    const { rows } = parseTable(text); if (!rows.length) return alert("No se detectaron filas.");
    const firstRow = rows[0]; const looksHeader = firstRow.some(c => { const n = normKey(c); return Object.values(HEADER_ALIASES).some(list => list.some(a => n.includes(a))); }) && !parseDate(firstRow[0]);
    const headers = looksHeader ? firstRow : firstRow.map((_, i) => ["tipo", "fecha", "km", "galones", "costo", "lleno", "servicio", "notas"][i] || `Col ${i + 1}`);
    const dataRows = looksHeader ? rows.slice(1) : rows; let mapping = looksHeader ? detectMapping(headers) : {};
    if (!Object.keys(mapping).length) mapping = { 0: "type", 1: "date", 2: "km", 3: "gallons", 4: "cost", 5: "fullTank", 6: "maintType", 7: "notes" };
    UI.importPreview = { headers, rows: dataRows, mapping }; render();
  } catch (err) { alert("Error al analizar los datos: " + err.message); console.error(err); }
}
function runConfirmImport() {
  try {
    const p = UI.importPreview; if (!p) return alert("No hay datos para importar.");
    const b = activeBike(); const idx = {};
    Object.entries(p.mapping).forEach(([col, field]) => { if (field && idx[field] === undefined) idx[field] = +col; });
    if (idx.km === undefined) return alert("Debes mapear al menos la columna de Kilometraje.");
    let addedFuel = 0, addedMaint = 0, skipped = 0, invalid = 0; let maxKm = b.odometer;
    p.rows.forEach(r => {
      const km = parseNum(r[idx.km]); if (!isFinite(km) || km < 0) { invalid++; return; }
      const date = idx.date !== undefined ? (parseDate(r[idx.date]) || todayISO()) : todayISO();
      const cost = idx.cost !== undefined ? parseNum(r[idx.cost]) : NaN;
      const notes = idx.notes !== undefined ? String(r[idx.notes] || "").trim() : "";
      const typeStr = idx.type !== undefined ? String(r[idx.type]).toLowerCase() : "";
      const isFuel = typeStr.includes("gas") || typeStr.includes("combust") || typeStr === "" || (idx.gallons !== undefined && parseNum(r[idx.gallons]) > 0 && typeStr === "");
      const isMaint = !isFuel || typeStr.includes("mant") || typeStr.includes("aceite") || typeStr.includes("servicio");
      if (isFuel && !isMaint) {
        const gallons = idx.gallons !== undefined ? parseNum(r[idx.gallons]) : NaN;
        const fullTank = idx.fullTank !== undefined ? boolFromCell(r[idx.fullTank]) : false;
        const dup = b.fuel.some(f => f.date === date && Math.round(f.km) === Math.round(km));
        if (dup) { skipped++; return; }
        b.fuel.push({ id: uid(), date, km, gallons: isFinite(gallons) && gallons > 0 ? gallons : 0, cost: isFinite(cost) && cost >= 0 ? cost : 0, fullTank, notes });
        addedFuel++;
      } else {
        let mTypeRaw = idx.maintType !== undefined ? String(r[idx.maintType]).toLowerCase() : "general";
        let mType = "general";
        if (mTypeRaw.includes("aceite") || mTypeRaw.includes("oil")) mType = "oil"; else if (mTypeRaw.includes("freno") || mTypeRaw.includes("balata")) mType = "brakePads"; else if (mTypeRaw.includes("cadena") || mTypeRaw.includes("lubric")) mType = "chainLube"; else if (mTypeRaw.includes("llanta") || mTypeRaw.includes("neumat")) mType = "tires"; else if (mTypeRaw.includes("filtro")) mType = "airFilter"; else if (mTypeRaw.includes("bujia") || mTypeRaw.includes("bujía")) mType = "sparkPlug"; else if (mTypeRaw.includes("bateria") || mTypeRaw.includes("batería")) mType = "battery"; else if (b.config[mTypeRaw]) mType = mTypeRaw;
        const dup = b.maintenance.some(m => m.date === date && Math.round(m.km) === Math.round(km) && m.type === mType);
        if (dup) { skipped++; return; }
        b.maintenance.push({ id: uid(), type: mType, date, km, cost: isFinite(cost) && cost >= 0 ? cost : 0, notes });
        addedMaint++;
      }
      if (km > maxKm) maxKm = km;
    });
    b.odometer = Math.max(b.odometer, maxKm); syncOdometer(b); UI.importPreview = null; commit();
    alert(`Importación completada ✅\n\n• Gasolina agregada: ${addedFuel}\n• Mantenimientos agregados: ${addedMaint}\n• Duplicados omitidos: ${skipped}\n• Filas inválidas: ${invalid}\n• Odómetro actualizado a: ${fmt0(b.odometer)} km`);
  } catch (err) { alert("Error al importar: " + err.message); console.error(err); }
}
function runRestoreJSON() {
  try {
    const txt = ($("#restoreText")?.value || "").trim(); if (!txt) return alert("Pega el contenido del respaldo JSON.");
    const obj = JSON.parse(txt); if (!obj || !Array.isArray(obj.bikes) || !obj.bikes.length) return alert("El JSON no contiene motos válidas.");
    if (!confirm("Esto reemplazará TODOS los datos actuales. ¿Continuar?")) return;

    UI.sub = null; commit(); alert("Respaldo restaurado ✅");

    case "clearHist": UI.history = { kind: "all", from: "", to: "" }; render(); break;
    case "exportJSON": downloadFile(JSON.stringify(STATE, null, 2), `motocontrol-backup-${todayISO()}.json`, "application/json"); break;
    case "exportCSV": { const rows = [["tipo", "fecha", "km", "galones", "costo", "lleno", "notas", "servicio"]]; b.fuel.forEach(f => rows.push(["gasolina", f.date, f.km, f.gallons, f.cost, f.fullTank ? "si" : "no", f.notes || "", ""])); b.maintenance.forEach(m => rows.push(["mantenimiento", m.date, m.km, "", m.cost, "", m.notes || "", m.type])); const csv = rows.map(r => r.map(c => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n"); downloadFile("\uFEFF" + csv, `moto-${slug(b.name)}-${todayISO()}.csv`, "text/csv;charset=utf-8"); break; }
    case "analyzeImport": runAnalyzeImport(); break;
    case "cancelImport": UI.importPreview = null; render(); break;
    case "confirmImport": runConfirmImport(); break;
    case "restoreJSON": runRestoreJSON(); break;
    case "print": window.print(); break;
  }
});

document.addEventListener("change", e => {
  if (e.target.id === "bikeSel") { STATE.activeBikeId = e.target.value; UI.sub = null; UI.importPreview = null; commit(); }
  if (e.target.id === "importFile") { const file = e.target.files && e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = () => { const ta = $("#importText"); if (ta) ta.value = String(reader.result); }; reader.readAsText(file, "UTF-8"); }
  if (e.target.matches("[data-map]") && UI.importPreview) { UI.importPreview.mapping[+e.target.dataset.map] = e.target.value; }
});

document.addEventListener("submit", e => {
  const form = e.target; const b = activeBike();
  if (form.id === "fuelForm") { e.preventDefault(); const fd = new FormData(form); const km = toNum(fd.get("km")), gallons = toNum(fd.get("gallons")), cost = toNum(fd.get("cost")); const date = fd.get("date") || todayISO(); if (!isFinite(km) || km < 0) return alert("Kilometraje inválido."); if (!isFinite(gallons) || gallons <= 0) return alert("Galones deben ser mayores a 0."); if (!isFinite(cost) || cost < 0) return alert("Costo inválido."); b.fuel.push({ id: Date.now().toString(36), date, km, gallons, cost, fullTank: fd.get("fullTank") === "on", notes: "" }); syncOdometer(b); commit(); return; }
  if (form.id === "maintForm") { e.preventDefault(); const fd = new FormData(form); const km = toNum(fd.get("km")); if (!isFinite(km) || km < 0) return alert("Kilometraje inválido."); b.maintenance.push({ id: Date.now().toString(36), type: fd.get("type"), date: fd.get("date") || todayISO(), km, cost: toNum(fd.get("cost")) || 0, notes: (fd.get("notes") || "").toString().trim() }); syncOdometer(b); closeModal(); commit(); return; }
  if (form.id === "docForm") { e.preventDefault(); const fd = new FormData(form); const key = fd.get("key"), date = fd.get("date"); if (!date) return alert("Fecha inválida."); b.docs[key] = { date, notes: (fd.get("notes") || "").toString().trim() }; closeModal(); commit(); return; }
  if (form.id === "bikeForm") { e.preventDefault(); const fd = new FormData(form); const id = fd.get("id"), name = (fd.get("name") || "").trim() || "Mi Moto"; const tank = Math.max(toNum(fd.get("tank")) || 0, 0), odo = Math.max(toNum(fd.get("odo")) || 0, 0); if (id) { const bk = STATE.bikes.find(x => x.id === id); if (bk) { bk.name = name; bk.tankCapacity = tank; bk.odometer = odo; syncOdometer(bk); } } else { const nb = newBike(name); nb.tankCapacity = tank; nb.odometer = odo; STATE.bikes.push(nb); STATE.activeBikeId = nb.id; } closeModal(); commit(); return; }
});

/* ==========================================
   ARRANQUE
   ========================================== */
(function init() {
  STATE = loadState();
  try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); } catch (e) {}
  if (!STATE.bikes.length) STATE = defaultState();
  if (!STATE.bikes.some(b => b.id === STATE.activeBikeId)) STATE.activeBikeId = STATE.bikes[0].id;
  saveState(); render();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
})();
</script>
</body>
</html>
